<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Pomodoro Cartoon Companion — Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="overlay-root" id="overlayRoot">
    <!-- 1. Pomodoro / 16:00 Alert Speech Bubble -->
    <div class="alert-bubble" id="alertBubble">
      <div class="alert-header">
        <span class="time-badge" id="alertTimeBadge">🍅 ครบเวลาโฟกัส!</span>
        <span class="character-name-tag" id="alertCharacterName">👨‍🌾 ลุงสมชาย</span>
      </div>
      <div class="alert-message" id="alertMessageText">
        🍅 ครบเวลาแล้ว! พักสายตาสักนิดนะ
      </div>
      <div class="alert-actions">
        <button class="btn btn-dismiss" id="btnNextPhase">
          ☕ เริ่มเวลาพัก
        </button>
        <button class="btn btn-snooze" id="btnDismiss">
          ✅ ปิดแจ้งเตือน
        </button>
        <button class="btn btn-snooze" id="btnSnooze5">
          💤 +5m
        </button>
      </div>
    </div>

    <!-- 2. Combined Character Label + Action Menu (Shown ONLY when hovering character) -->
    <div class="char-hover-menu" id="charHoverMenu">
      <span class="char-behavior-label" id="charBehaviorLabel">🚜 ขับรถไถฟาร์ม</span>
      <span class="menu-divider"></span>
      <button class="tool-btn" id="btnNextBehavior" title="Switch character behavior">
        🎭 ท่าถัดไป
      </button>
      <button class="tool-btn drag-handle" id="btnDragHandle" title="Drag to move on screen">
        ✋ ย้าย
      </button>
      <button class="tool-btn" id="btnOpenSettings" title="Open Settings">
        ⚙️ ตั้งค่า
      </button>
    </div>

    <!-- 3. Lean Bottom-Right Pomodoro Corner Pill (Mode + Timer only; reveals CTA on hover) -->
    <div class="pomodoro-corner" id="pomodoroCorner">
      <span class="hud-phase" id="hudPhase">🍅 โฟกัส</span>
      <span class="hud-timer" id="hudTimer">25:00</span>
      <div class="pomodoro-cta" id="pomodoroCta">
        <span class="hud-cycle" id="hudCycle">1/4</span>
        <button class="hud-btn" id="btnHudStartPause" title="Start / Pause">▶️</button>
        <button class="hud-btn" id="btnHudSkip" title="Skip Interval">⏭️</button>
        <button class="hud-btn" id="btnHudReset" title="Reset Timer">🔄</button>
      </div>
    </div>

    <!-- 2D Cartoon Canvas -->
    <canvas id="cartoonCanvas" width="460" height="335"></canvas>
  </div>

  <script src="cartoon-engine.js"></script>
  <script>
    const canvas = document.getElementById('cartoonCanvas');
    const alertBubble = document.getElementById('alertBubble');
    const charHoverMenu = document.getElementById('charHoverMenu');
    const charBehaviorLabel = document.getElementById('charBehaviorLabel');
    const btnNextBehavior = document.getElementById('btnNextBehavior');
    const btnDragHandle = document.getElementById('btnDragHandle');
    const btnOpenSettings = document.getElementById('btnOpenSettings');

    const pomodoroCorner = document.getElementById('pomodoroCorner');
    const hudPhase = document.getElementById('hudPhase');
    const hudTimer = document.getElementById('hudTimer');
    const hudCycle = document.getElementById('hudCycle');
    const btnHudStartPause = document.getElementById('btnHudStartPause');
    const btnHudSkip = document.getElementById('btnHudSkip');
    const btnHudReset = document.getElementById('btnHudReset');

    const alertTimeBadge = document.getElementById('alertTimeBadge');
    const alertCharacterName = document.getElementById('alertCharacterName');
    const alertMessageText = document.getElementById('alertMessageText');
    const btnNextPhase = document.getElementById('btnNextPhase');
    const btnDismiss = document.getElementById('btnDismiss');
    const btnSnooze5 = document.getElementById('btnSnooze5');

    let currentConfig = { language: 'th' };
    let currentState = { isAlerting: false, pomodoro: {} };
    let soundTimer = null;
    let isDraggingWindow = false;
    let dragStartScreen = { x: 0, y: 0 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function tr(th, en) {
      return currentConfig.language === 'en' ? en : th;
    }

    function updateCharHoverLabel() {
      charBehaviorLabel.textContent = engine.getCurrentBehaviorLabel();
    }

    const engine = new CartoonEngine(canvas, {
      isPreview: false,
      onBehaviorChange: () => updateCharHoverLabel()
    });
    engine.start();

    // Keep combined hover menu centered horizontally over the walking cartoon
    setInterval(() => {
      if (charHoverMenu.classList.contains('visible')) {
        updateCharHoverLabel();
        const menuW = charHoverMenu.offsetWidth || 220;
        const clampedX = Math.max(
          menuW / 2 + 8,
          Math.min(window.innerWidth - menuW / 2 - 8, engine.x)
        );
        charHoverMenu.style.left = `${clampedX}px`;
      }
    }, 60);

    function formatMMSS(sec) {
      const abs = Math.max(0, Math.floor(sec || 0));
      const m = String(Math.floor(abs / 60)).padStart(2, '0');
      const s = String(abs % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function playAlertChime() {
      if (currentConfig.soundEnabled === false) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + idx * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.42);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.45);
        });
      } catch (e) {}
    }

    function applyConfigAndState() {
      const p = currentState.pomodoro || {};
      const pCfg = currentConfig.pomodoro || {};
      const isOvertime = p.status === 'overtime';

      engine.setAlerting(currentState.isAlerting, isOvertime);
      engine.setConfig(currentConfig);

      if (currentState.forcedBehavior) {
        engine.setBehaviorMode(currentState.forcedBehavior);
      }

      updateCharHoverLabel();

      // Update Lean Bottom-Right Pomodoro Corner Pill
      pomodoroCorner.classList.toggle('overtime', isOvertime);
      if (p.phase === 'focus') {
        hudPhase.textContent = isOvertime
          ? tr('🔥 ล่วงเวลา', '🔥 Overtime')
          : tr('🍅 โฟกัส', '🍅 Focus');
      } else if (p.phase === 'shortBreak') {
        hudPhase.textContent = tr('☕ พักสั้น', '☕ Short Break');
      } else {
        hudPhase.textContent = tr('🌴 พักยาว', '🌴 Long Break');
      }

      hudTimer.textContent = isOvertime
        ? `+${formatMMSS(p.overtimeSeconds)}`
        : formatMMSS(p.remainingSeconds);

      const totalCycles = Math.max(1, Number(pCfg.sessionsBeforeLongBreak) || 4);
      hudCycle.textContent = `${p.currentSession || 1}/${totalCycles}`;

      const locked = Boolean(p.strictLocked);
      btnHudStartPause.disabled = locked;
      btnHudSkip.disabled = locked;
      btnHudReset.disabled = locked;

      if (p.status === 'running') {
        btnHudStartPause.textContent = locked ? '🔒' : tr('⏸️ พัก', '⏸️ Pause');
      } else {
        btnHudStartPause.textContent = tr('▶️ เริ่ม', '▶️ Start');
      }
      btnHudSkip.textContent = tr('⏭️ ข้าม', '⏭️ Skip');
      btnHudReset.textContent = tr('🔄 รีเซ็ต', '🔄 Reset');

      // Update Combined Character Hover Menu Buttons
      btnNextBehavior.textContent = tr('🎭 ท่าถัดไป', '🎭 Next');
      btnDragHandle.textContent = tr('✋ ย้าย', '✋ Move');
      btnOpenSettings.textContent = tr('⚙️ ตั้งค่า', '⚙️ Settings');

      // Update Alert Bubble
      alertTimeBadge.textContent =
        currentState.alertBannerTitle || tr('🍅 แจ้งเตือนโพโมโดโร', '🍅 Pomodoro Alert');
      alertCharacterName.textContent = `✨ ${currentConfig.characterName || 'Companion'}`;
      alertMessageText.textContent =
        currentState.alertBannerText ||
        currentConfig.alertMessage ||
        tr('ครบเวลาแล้ว! พักสายตาสักนิดนะ', 'Session Complete! Time for a break!');

      btnNextPhase.textContent =
        p.phase === 'focus'
          ? tr('☕ เริ่มเวลาพัก', '☕ Start Break')
          : tr('▶️ เริ่มโฟกัส', '▶️ Start Focus');
      btnDismiss.textContent = tr('✅ ปิดแจ้งเตือน', '✅ Dismiss');

      const wasAlerting = alertBubble.classList.contains('visible');
      if (currentState.isAlerting) {
        alertBubble.classList.add('visible');
        if (!wasAlerting) {
          playAlertChime();
          if (soundTimer) clearInterval(soundTimer);
          soundTimer = setInterval(() => {
            if (currentState.isAlerting) playAlertChime();
          }, 9000);
        }
      } else {
        alertBubble.classList.remove('visible');
        if (soundTimer) {
          clearInterval(soundTimer);
          soundTimer = null;
        }
      }
    }

    Promise.all([window.companionAPI.getConfig(), window.companionAPI.getState()]).then(
      ([cfg, st]) => {
        currentConfig = cfg;
        currentState = st;
        applyConfigAndState();
      }
    );

    window.companionAPI.onConfigUpdated((cfg) => {
      currentConfig = cfg;
      applyConfigAndState();
    });

    window.companionAPI.onStateUpdated((st) => {
      currentState = st;
      applyConfigAndState();
    });

    // Pomodoro Corner CTA Controls
    btnHudStartPause.addEventListener('click', () => {
      window.companionAPI.pomodoroStartPause();
    });

    btnHudSkip.addEventListener('click', () => {
      window.companionAPI.pomodoroSkip(true);
    });

    btnHudReset.addEventListener('click', () => {
      window.companionAPI.pomodoroReset(false);
    });

    // Alert Bubble Buttons
    btnNextPhase.addEventListener('click', () => {
      window.companionAPI.pomodoroSkip(true);
    });

    btnDismiss.addEventListener('click', () => {
      window.companionAPI.dismissAlert();
    });

    btnSnooze5.addEventListener('click', () => {
      window.companionAPI.snoozeAlert(5);
    });

    // Combined Character Hover Menu Buttons
    btnNextBehavior.addEventListener('click', () => {
      const nextId = engine.nextBehavior();
      updateCharHoverLabel();
      window.companionAPI.setBehaviorNow(nextId);
    });

    btnOpenSettings.addEventListener('click', () => {
      window.companionAPI.openSettings('main');
    });

    btnDragHandle.addEventListener('mousedown', (e) => {
      if (currentConfig.dragLocked) return;
      isDraggingWindow = true;
      dragStartScreen = { x: e.screenX, y: e.screenY };
      window.companionAPI.setIgnoreMouseEvents(false);
    });

    window.addEventListener('mousemove', (e) => {
      if (isDraggingWindow) {
        const dx = e.screenX - dragStartScreen.x;
        const dy = e.screenY - dragStartScreen.y;
        dragStartScreen = { x: e.screenX, y: e.screenY };
        window.companionAPI.moveOverlayBy(dx, dy);
        return;
      }

      // 1. Check if hovering over Cartoon Character or its Combined Label+Action Menu
      const cb = engine.getCharacterBounds();
      const inCharacter =
        e.clientX >= cb.x - 14 &&
        e.clientX <= cb.x + cb.width + 14 &&
        e.clientY >= cb.y - 20 &&
        e.clientY <= cb.y + cb.height + 10;

      const menuRect = charHoverMenu.getBoundingClientRect();
      const inCharMenu =
        charHoverMenu.classList.contains('visible') &&
        e.clientX >= menuRect.left - 12 &&
        e.clientX <= menuRect.right + 12 &&
        e.clientY >= menuRect.top - 12 &&
        e.clientY <= menuRect.bottom + 24;

      if (inCharacter || inCharMenu) {
        updateCharHoverLabel();
        charHoverMenu.classList.add('visible');
      } else {
        charHoverMenu.classList.remove('visible');
      }

      // 2. Check if hovering over Bottom-Right Pomodoro Corner Pill -> expand Call to Action
      const pomoRect = pomodoroCorner.getBoundingClientRect();
      const inPomoCorner =
        e.clientX >= pomoRect.left - 10 &&
        e.clientX <= pomoRect.right + 10 &&
        e.clientY >= pomoRect.top - 10 &&
        e.clientY <= pomoRect.bottom + 10;

      pomodoroCorner.classList.toggle('expanded', inPomoCorner);

      // 3. Check if hovering over Alert Bubble
      const bubbleRect = alertBubble.getBoundingClientRect();
      const inBubble =
        currentState.isAlerting &&
        e.clientX >= bubbleRect.left - 8 &&
        e.clientX <= bubbleRect.right + 8 &&
        e.clientY >= bubbleRect.top - 8 &&
        e.clientY <= bubbleRect.bottom + 8;

      if (inCharacter || inCharMenu || inPomoCorner || inBubble) {
        window.companionAPI.setIgnoreMouseEvents(false);
      } else {
        window.companionAPI.setIgnoreMouseEvents(true);
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDraggingWindow) {
        isDraggingWindow = false;
        window.companionAPI.saveCurrentOverlayPosition();
      }
    });
  </script>
</body>
</html>
